<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A2E5C">
<meta name="description" content="MamaPlan : préparez le jour de l'accouchement. Consultations, budget, valise, transport et signes d'alerte. Hors ligne, sans compte.">
<title>MamaPlan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{
  --bg:#FFF8F1;--card:#FFFFFF;--ink:#2A1A2E;--muted:#6E5B70;--line:#EADCD3;
  --brand:#7A2E5C;--brand-2:#B4477F;--sun:#F3A73B;--sun-soft:#FFF0D6;--coral:#E8664F;
  --ok:#2F7D57;--ok-soft:#E3F3EA;--danger:#C2262E;--danger-soft:#FDE8E8;
  --radius:18px;--shadow:0 2px 10px rgba(74,30,58,.08);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1C1320;--card:#291D2E;--ink:#F6EDF3;--muted:#C2B0C2;--line:#433446;--brand:#E58BBE;--brand-2:#F0A6CF;--sun:#F6B95A;--sun-soft:#3A2C1C;--ok:#6FD3A0;--ok-soft:#1E3529;--danger:#FF6B6B;--danger-soft:#3D1F22;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--brand);letter-spacing:-.3px;flex:1}
.logo svg{width:30px;height:30px}
.pill{font-size:11px;font-weight:700;background:var(--sun);color:#2A1A2E;border-radius:99px;padding:2px 8px;letter-spacing:.3px}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.alert-btn{white-space:nowrap;border:0;background:var(--danger);color:#fff;font-weight:700;border-radius:12px;padding:0 12px;height:42px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.alert-btn svg{width:18px;height:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .wrap{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;cursor:pointer;border-radius:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand);font-weight:700;background:color-mix(in srgb,var(--brand) 10%,transparent)}
h1{font-size:24px;margin:8px 0 6px;letter-spacing:-.4px}
h2{font-size:18px;margin:22px 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.85)}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12.5px;color:var(--muted)}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px;transition:width .4s}
.hero .bar{background:rgba(255,255,255,.25)}
.hero .bar i{background:var(--sun)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn.soft{background:var(--sun-soft);color:var(--ink)}
.btn.wa{background:#1F9D55;color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:12px}
.btn svg{width:20px;height:20px}
label.f{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;min-height:48px}
textarea.i{min-height:84px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--brand)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line)}
ul.check li:last-child{border-bottom:0}
.box{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:var(--card);cursor:pointer;margin-top:-1px}
.box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.box svg{width:16px;height:16px}
.li-text{flex:1}
.li-text.done{color:var(--muted);text-decoration:line-through}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:2px 6px}
.cpn{border-left:5px solid var(--line)}
.cpn.done{border-left-color:var(--ok)}
.cpn.soon{border-left-color:var(--sun)}
.cpn.late{border-left-color:var(--coral)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.sun{background:var(--sun-soft);color:#8A5A00}
.tag.late{background:var(--danger-soft);color:var(--danger)}
details summary{cursor:pointer;font-weight:600;color:var(--brand);padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
.danger-card{background:var(--danger-soft);border:2px solid var(--danger)}
.danger-card h3{color:var(--danger)}
.signs{margin:6px 0 0;padding-left:20px}
.signs li{margin:6px 0;font-weight:600}
.soon-card{background:var(--sun-soft);border:1px solid var(--sun)}
.callbar{display:grid;gap:8px;margin:12px 0}
.lock{position:relative}
.lock-cover{background:linear-gradient(180deg,transparent,var(--bg) 40%);padding:16px;border-radius:var(--radius);text-align:center}
.lock-box{background:var(--card);border:2px dashed var(--brand);border-radius:var(--radius);padding:18px;text-align:center}
.lock-box svg{width:36px;height:36px;color:var(--brand)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ct-btn{width:100%;min-height:120px;border-radius:24px;font-size:20px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600;font-size:12.5px}
.money-line{display:grid;grid-template-columns:1fr 1fr 28px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.money-line .lbl{grid-column:1 / -1;display:flex;justify-content:space-between;gap:8px;font-weight:600}
.money-line input{min-height:44px;padding:9px}
.sub{font-size:12px;color:var(--muted);margin-bottom:3px}
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.ob .logo{font-size:30px;justify-content:center;flex:none;margin-bottom:8px}
.ob .logo svg{width:52px;height:52px}
.center{text-align:center}
.sheet{background:#fff;color:#1a1a1a}
.sheet h1{color:#7A2E5C}
.sheet table{width:100%;border-collapse:collapse;margin:8px 0}
.sheet td{border:1px solid #ddd;padding:8px;vertical-align:top;font-size:14px}
.sheet td:first-child{width:38%;color:#555;font-weight:600}
.hidden{display:none!important}
@media print{
  body{background:#fff}
  header.top,nav.tabs,.noprint,.toast{display:none!important}
  .app{padding:0;max-width:none}
  .card{box-shadow:none;border:0}
}

:root[data-theme="dark"]{--bg:#1C1320;--card:#291D2E;--ink:#F6EDF3;--muted:#C2B0C2;--line:#433446;--brand:#E58BBE;--brand-2:#F0A6CF;--sun:#F6B95A;--sun-soft:#3A2C1C;--ok:#6FD3A0;--ok-soft:#1E3529;--danger:#FF6B6B;--danger-soft:#3D1F22;--shadow:none}
.hero{color:#fff}
@media (prefers-color-scheme: dark){.hero{background:linear-gradient(135deg,#7A2E5C,#B4477F)}}
</style>
</head>

<script>// MamaPlan : application hors ligne, données stockées sur l'appareil uniquement (localStorage).

  const BUY_WA = '237679092458';                             // WhatsApp de vente
  const CPN_WEEKS = [12, 20, 26, 30, 34, 36, 38, 40];        // OMS 2016 : 8 contacts

  const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const SALT = 'mamaplan-lss-2026';
  function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
  function checkOf(body) { let h = fnv(SALT + body); let c = ''; for (let i = 0; i < 3; i++) { c += ALPH[h % 31]; h = Math.floor(h / 31); } return c; }
  function normCode(raw) { let s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (s.startsWith('MP')) s = s.slice(2); return s; }
  function validCode(raw) { const s = normCode(raw); if (s.length !== 8) return false; for (const ch of s) if (!ALPH.includes(ch)) return false; return checkOf(s.slice(0, 5)) === s.slice(5); }

  // ---------- état ----------
  function blankState(lang) {
    const bag = {}; for (const c of ['mom', 'baby', 'papers', 'comp']) bag[c] = I18N.fr.bagItems[c].map((_, i) => ({ k: c + '.' + i, ok: false }));
    return {
      v: 1, lang: lang || 'fr', name: '', dpa: '', unlocked: false, code: '', signsRead: false, created: Date.now(),
      cpn: {}, budget: { lines: I18N.fr.bLines.map((_, i) => ({ k: i, planned: 0, paid: 0 })), people: [] },
      bag, plan: { facility: {}, attendant: {}, t1: {}, t2: {}, companion: {}, donors: [{}, {}], myGroup: '', kids: {}, money: '', family: {}, wishes: '', useful: '' },
      contractions: []
    };
  }
  let S;
  function load() { try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return Object.assign(blankState(o.lang), o); } } catch (e) { } return null; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ Stockage indisponible / storage unavailable'); } }
  S = load();
  let view = 'home', seg = 'preg', prevView = 'home';

  // ---------- utilitaires ----------
  const T = () => I18N[(S && S.lang) || navLang()];
  function navLang() { return (navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr'; }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const parseD = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const isoD = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const fmtD = d => d.toLocaleDateString(S.lang === 'en' ? 'en-GB' : 'fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  const fmtShort = d => d.toLocaleDateString(S.lang === 'en' ? 'en-GB' : 'fr-FR', { day: 'numeric', month: 'short' });
  const money = n => Math.round(n || 0).toLocaleString('fr-FR').replace(/ | /g, ' ') + ' ' + T().fcfa;
  const num = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g, '')); return isNaN(n) ? 0 : n; };
  const telHref = p => 'tel:' + String(p || '').replace(/[^0-9+]/g, '');
  function daysLeft() { const d = parseD(S.dpa); return d ? Math.round((d - today()) / DAY) : null; }
  function gaWeek() { const dl = daysLeft(); return dl == null ? null : Math.max(0, Math.floor((280 - dl) / 7)); }
  function cpnDate(i) { return new Date(parseD(S.dpa).getTime() - (40 - CPN_WEEKS[i]) * 7 * DAY); }
  function bagLabel(c, it) { return it.t != null ? it.t : (T().bagItems[c][Number(it.k.split('.')[1])] || ''); }
  function lineLabel(l) { return l.t != null ? l.t : T().bLines[l.k]; }
  let toastT; function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }
  function share(text) { const url = 'https://wa.me/?text=' + encodeURIComponent(text); window.open(url, '_blank', 'noopener'); }

  // ---------- calculs ----------
  function bagStats(cats) { let n = 0, ok = 0; for (const c of cats) for (const it of S.bag[c]) { n++; if (it.ok) ok++; } return { n, ok, pct: n ? ok / n : 0 }; }
  function budgetStats() {
    const planned = S.budget.lines.reduce((a, l) => a + num(l.planned), 0);
    const paid = S.budget.lines.reduce((a, l) => a + num(l.paid), 0);
    const recv = S.budget.people.reduce((a, p) => a + (p.received ? num(p.amount) : 0), 0);
    const promised = S.budget.people.reduce((a, p) => a + (!p.received ? num(p.amount) : 0), 0);
    const gathered = paid + recv; const left = Math.max(0, planned - gathered - promised);
    const dl = daysLeft(); const weeks = dl == null ? 0 : Math.max(1, Math.ceil(dl / 7));
    return { planned, gathered, promised, left, weeks, perWeek: left / weeks };
  }
  const has = o => o && (o.name || o.phone);
  function readiness() {
    const p = S.plan; const b = budgetStats(); const td = today();
    const overdue = CPN_WEEKS.some((w, i) => !(S.cpn[i] && S.cpn[i].done) && S.dpa && (td - cpnDate(i)) / DAY > 14);
    const items = [
      ['r_dpa', !!S.dpa, 'settings'], ['r_facility', !!(p.facility.name), 'plan'], ['r_attendant', has(p.attendant), 'plan'],
      ['r_transport', !!(p.t1.phone), 'plan'], ['r_money', b.planned > 0 && b.left === 0, 'budget'],
      ['r_donor', p.donors.some(d => d.name || d.phone), 'plan'], ['r_companion', has(p.companion), 'plan'],
      ['r_bag', bagStats(['mom', 'baby']).pct >= 0.8, 'bag'], ['r_papers', bagStats(['papers']).pct >= 1, 'bag'],
      ['r_signs', !!S.signsRead, 'alerts'], ['r_cpn', !!S.dpa && !overdue, 'cpn']
    ];
    return { items, done: items.filter(i => i[1]).length, total: items.length };
  }

  // ---------- icônes ----------
  const I = {
    logo: '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#7A2E5C"/><path d="M15 31c0-6 4-10 9-10s9 4 9 10" fill="none" stroke="#F3A73B" stroke-width="3.2" stroke-linecap="round"/><circle cx="24" cy="15.5" r="4.2" fill="#FFF8F1"/><path d="M19 33.5h10" stroke="#FFF8F1" stroke-width="3.2" stroke-linecap="round"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    coin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>',

    return `<nav class="tabs"><div class="wrap">${items.map(([v, ic, l]) => `<button data-go="${v}" class="${view === v ? 'on' : ''}" aria-current="${view === v}">${ic}<span>${esc(l)}</span></button>`).join('')}</div></nav>`;

  function vHome() {
    const t = T(); const dl = daysLeft(); const wk = gaWeek(); const r = readiness();
    let count;
    if (dl > 1) count = `<div class="big">${t.dP}-${dl}</div><div class="muted">${dl} ${esc(t.daysLeft)}</div>`;
    else if (dl === 1) count = `<div class="big">${t.dP}-1</div><div class="muted">1 ${esc(t.dayLeft)}</div>`;
    else if (dl === 0) count = `<div class="big">${t.dP}</div><div class="muted">${esc(t.dueToday)}</div>`;
    else count = `<div class="big">${t.dP}+${-dl}</div><div class="muted">${-dl} ${esc(t.pastDue)}</div>`;
    const next = CPN_WEEKS.map((w, i) => ({ i, d: cpnDate(i) })).find(c => !(S.cpn[c.i] && S.cpn[c.i].done) && c.d >= new Date(today() - 14 * DAY));
    const todo = r.items.filter(i => !i[1]).slice(0, 4);
    return `<h1>${esc(S.name ? t.hello + ' ' + S.name : t.helloAnon)} 👋</h1>
    <div class="card hero">
      <div class="spread"><div>${count}</div><div style="text-align:right"><div class="muted small">${esc(t.week)}</div><div style="font-size:30px;font-weight:800">${wk}</div></div></div>
      <p class="muted small" style="margin-top:10px">${esc(t.dueOn)}${t.colon} ${fmtD(parseD(S.dpa))}</p>
    </div>
    <div class="card">
      <div class="spread"><h3>${esc(t.readiness)}</h3><b>${r.done}/${r.total}</b></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${r.total}" aria-valuenow="${r.done}"><i style="width:${Math.round(100 * r.done / r.total)}%"></i></div>
      <p class="small muted">${esc(t.readinessHelp)}</p>
      <h3 style="margin-top:12px">${esc(t.nextSteps)}</h3>
      ${todo.length ? `<ul class="check">${todo.map(i => `<li data-go="${i[2]}" style="cursor:pointer"><span class="box"></span><span class="li-text">${esc(t[i[0]])}</span><span class="muted">›</span></li>`).join('')}</ul>` : `<p>${esc(t.allDone)}</p>`}
    </div>
    <div class="card" data-go="cpn" style="cursor:pointer">
      <h3>${esc(t.nextCpn)}</h3>
      ${next ? `<p><b>${esc(t.cpnContact)} ${next.i + 1}</b> · ${esc(t.cpnAround)} ${fmtD(next.d)} (${CPN_WEEKS[next.i]} ${esc(t.weeksShort)})</p>` : `<p>${esc(t.noNextCpn)}</p>`}
    </div>
    <div class="grid2">
      <button class="btn soft" data-go="contractions">${I.clock}${esc(t.ctTitle)}</button>
      <button class="btn soft" data-go="sheet">${I.doc}${esc(t.shTitle)}</button>
    </div>
    <p class="small muted" style="margin-top:18px">${esc(t.disclaimer)}</p>`;
  }

  function vCpn() {
    const t = T(); const td = today();
    return `<h1>${esc(t.cpnTitle)}</h1><p class="muted small">${esc(t.cpnIntro)}</p>
    ${CPN_WEEKS.map((w, i) => {
      const d = cpnDate(i); const st = S.cpn[i] || {}; const diff = (d - td) / DAY;
      let cls = '', tag = '';
      if (st.done) { cls = 'done'; tag = `<span class="tag ok">✓ ${esc(t.cpnDone)}</span>`; }
      else if (diff < -14) { cls = 'late'; tag = `<span class="tag late">${esc(t.cpnLate)}</span>`; }
      else if (diff <= 14) { cls = 'soon'; tag = `<span class="tag sun">${esc(t.cpnSoon)}</span>`; }
      return `<div class="card cpn ${cls}">
        <div class="spread"><h3>${esc(t.cpnContact)} ${i + 1} · ${i === 0 ? esc(t.cpnFirst) : w + ' ' + esc(t.weeksShort)}</h3>${tag}</div>
        <p class="muted small">${esc(t.cpnAround)} ${fmtD(d)}</p>
        <details><summary>${esc(t.cpnQuestions)} (${t.cpnQ[i].length})</summary><ul class="small">${t.cpnQ[i].map(q => `<li>${esc(q)}</li>`).join('')}</ul></details>
        <label class="f" for="cpn-n-${i}">${esc(t.cpnNote)}</label>
        <textarea class="i" id="cpn-n-${i}" data-cpn-note="${i}" rows="2">${esc(st.note || '')}</textarea>
        <div style="margin-top:8px"><button class="btn sm ${st.done ? 'ghost' : ''}" data-a="cpn-done" data-i="${i}">${st.done ? esc(t.cpnUnmark) : esc(t.cpnMark)}</button></div>
      </div>`;
    }).join('')}`;
  }

  function lockBox() {

      <label class="f" for="code-in">${esc(t.lockHave)}</label>

      <div class="grid2" style="margin-top:8px"><a class="btn ghost sm" href="${BUY_URL}" target="_blank" rel="noopener">${esc(t.lockBuy)}</a><a class="btn wa sm" href="https://wa.me/${BUY_WA}?text=${encodeURIComponent(t.lockBuy + ' MamaPlan')}" target="_blank" rel="noopener">${I.wa}WhatsApp</a></div>
    </div>`;
  }

  function vBudget() {
    const t = T();
    if (!S.unlocked) return `<h1>${esc(t.budgetTitle)}</h1><p class="muted small">${esc(t.budgetIntro)}</p>${lockBox()}`;
    const b = budgetStats();
    return `<h1>${esc(t.budgetTitle)}</h1><p class="muted small">${esc(t.budgetIntro)}</p>
    <div class="card hero">
      <div class="grid2">
        <div><div class="muted small">${esc(t.bTotal)}</div><b style="font-size:22px">${money(b.planned)}</b></div>
        <div><div class="muted small">${esc(t.bGathered)}</div><b style="font-size:22px">${money(b.gathered)}</b></div>
      </div>
      <div class="bar" style="margin:12px 0"><i style="width:${b.planned ? Math.min(100, Math.round(100 * (b.gathered + b.promised) / b.planned)) : 0}%"></i></div>
      ${b.planned && b.left === 0 ? `<p><b>✓ ${esc(t.bReady)}</b></p>` : `<div class="spread"><div><div class="muted small">${esc(t.bLeft)}</div><b style="font-size:20px">${money(b.left)}</b></div>
      <div style="text-align:right"><div class="muted small">${esc(t.bPerWeek)}</div><b style="font-size:24px;color:var(--sun)">${money(b.perWeek)}</b></div></div>
      <p class="muted small">${b.weeks} ${esc(t.bWeeksLeft)}</p>`}
    </div>
    <p class="small muted">💡 ${esc(t.budgetExample)}</p>
    <div class="card">
      ${S.budget.lines.map((l, i) => `<div class="money-line">
        <div class="lbl">${l.t != null ? `<input class="i" data-bl-t="${i}" value="${esc(l.t)}" placeholder="${esc(t.bPost)}" style="min-height:40px;padding:8px">` : `<span>${esc(lineLabel(l))}</span>`}</div>
        <div><div class="sub">${esc(t.bPlanned)}</div><input class="i" inputmode="numeric" data-bl="${i}" data-f="planned" value="${l.planned || ''}" placeholder="0"></div>
        <div><div class="sub">${esc(t.bPaid)}</div><input class="i" inputmode="numeric" data-bl="${i}" data-f="paid" value="${l.paid || ''}" placeholder="0"></div>
        <button class="x" data-a="bl-del" data-i="${i}" aria-label="${esc(t.remove)}">×</button>
      </div>`).join('')}
      <button class="btn ghost sm" style="margin-top:10px" data-a="bl-add">+ ${esc(t.bAddLine)}</button>
    </div>
    <h2>${esc(t.bContrib)}</h2><p class="small muted">${esc(t.bContribHelp)}</p>
    <div class="card">
      ${S.budget.people.length ? S.budget.people.map((p, i) => `<div class="money-line">
        <div><div class="sub">${esc(t.bName)}</div><input class="i" data-bp="${i}" data-f="name" value="${esc(p.name || '')}"></div>
        <div><div class="sub">${esc(t.bAmount)}</div><input class="i" inputmode="numeric" data-bp="${i}" data-f="amount" value="${p.amount || ''}" placeholder="0"></div>
        <button class="x" data-a="bp-del" data-i="${i}" aria-label="${esc(t.remove)}">×</button>
        <label class="row small" style="grid-column:1 / -1;cursor:pointer"><span class="box ${p.received ? 'on' : ''}" data-a="bp-recv" data-i="${i}">${p.received ? I.tick : ''}</span>${esc(t.bReceived)}</label>
      </div>`).join('') : ''}
      <button class="btn ghost sm" style="margin-top:10px" data-a="bp-add">+ ${esc(t.bAddPerson)}</button>
    </div>
    <button class="btn wa block" data-a="share-budget">${I.wa}${esc(t.bShare)}</button>`;
  }

  function vBag() {

      <ul class="check">${S.bag[c].map((it, i) => `<li><span class="box ${it.ok ? 'on' : ''}" role="checkbox" aria-checked="${it.ok}" tabindex="0" data-a="bag-tog" data-c="${c}" data-i="${i}">${it.ok ? I.tick : ''}</span><span class="li-text ${it.ok ? 'done' : ''}">${esc(bagLabel(c, it))}</span><button class="x" data-a="bag-del" data-c="${c}" data-i="${i}" aria-label="${esc(t.bagDelete)}">×</button></li>`).join('')}</ul>
      <div class="row" style="margin-top:8px"><input class="i" id="bag-new-${c}" placeholder="${esc(t.bagAddPh)}" maxlength="80"><button class="btn sm" data-a="bag-add" data-c="${c}">+</button></div></div>`;
    }).join('')}

  function person(path, title, opts) {
    const t = T(); const o = getPath(path) || {}; opts = opts || {};
    return `<div class="card"><h3>${esc(title)}</h3>
      <label class="f">${esc(t.pName)}</label><input class="i" data-p="${path}.name" value="${esc(o.name || '')}">
      ${opts.addr ? `<label class="f">${esc(t.pAddr)}</label><input class="i" data-p="${path}.addr" value="${esc(o.addr || '')}">` : ''}
      <label class="f">${esc(t.pPhone)}</label>
      <div class="row"><input class="i" type="tel" inputmode="tel" data-p="${path}.phone" value="${esc(o.phone || '')}">${o.phone ? `<a class="btn sm" href="${telHref(o.phone)}" aria-label="${esc(t.call)}">${I.phone}</a>` : ''}</div>
      ${opts.group ? `<label class="f">${esc(t.pGroup)}</label><select class="i" data-p="${path}.group">${['', 'A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-', '?'].map(g => `<option ${o.group === g ? 'selected' : ''}>${g}</option>`).join('')}</select>` : ''}
    </div>`;
  }
  function getPath(path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), S.plan); }
  function setPath(path, val) { const ks = path.split('.'); let o = S.plan; for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }

  function vAlerts() {
    const t = T(); const p = S.plan;
    const calls = [[p.facility, t.alertCallFacility], [p.t1, t.alertCallTransport], [p.family, t.alertCallFamily]].filter(c => c[0] && c[0].phone);
    const list = (title, arr, cls) => `<div class="card ${cls}"><h3>${esc(title)}</h3><ul class="signs">${arr.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>`;
    return `<h1 style="color:var(--danger)">${esc(t.alertTitle)}</h1>
    <div class="callbar">${calls.length ? calls.map(c => `<a class="btn danger block" href="${telHref(c[0].phone)}">${I.phone}${esc(c[1])}${c[0].name ? ' · ' + esc(c[0].name) : ''}</a>`).join('') : `<p class="small muted">${esc(t.alertNoPhone)} <a href="#" data-go="plan">${esc(t.tabPlan)} ›</a></p>`}</div>
    <div class="seg"><button data-a="seg" data-v="preg" class="${seg === 'preg' ? 'on' : ''}">${esc(t.alertSegPreg)}</button><button data-a="seg" data-v="after" class="${seg === 'after' ? 'on' : ''}">${esc(t.alertSegAfter)}</button></div>
    ${seg === 'preg' ? list(t.alertNow, t.signsNow, 'danger-card') + list(t.alertLabour, t.signsLabour, 'soon-card') + list(t.alertSoon, t.signsSoon, '')
      : list(t.alertAfterMom, t.signsAfterMom, 'danger-card') + list(t.alertBaby, t.signsBaby, 'danger-card') + list(t.alertAfterMomSoon, t.signsAfterMomSoon, 'soon-card')}
    <p class="small muted">${esc(t.alertSource)}</p>
    ${S.signsRead ? `<p class="tag ok">✓ ${esc(t.alertRead)}</p>` : `<button class="btn block" data-a="signs-read">${I.tick}${esc(t.alertRead)}</button>`}`;
  }

  function ctStats() {
    const c = S.contractions.filter(x => x.e); const now = Date.now(); const hr = c.filter(x => now - x.s < 3600000);
    const ints = []; for (let i = 1; i < hr.length; i++) ints.push(hr[i].s - hr[i - 1].s);
    const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
    return { n: hr.length, int: avg(ints), dur: avg(hr.map(x => x.e - x.s)) };
  }
  const mmss = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0') + ' s'; };
  const hhmm = ms => new Date(ms).toLocaleTimeString(S.lang === 'en' ? 'en-GB' : 'fr-FR', { hour: '2-digit', minute: '2-digit' });
  function vContractions() {
    const t = T();
    if (!S.unlocked) return `<h1>${esc(t.ctTitle)}</h1><p class="muted small">${esc(t.ctIntro)}</p>${lockBox()}`;
    const running = S.contractions.length && !S.contractions[S.contractions.length - 1].e; const st = ctStats();
    const rows = S.contractions.slice(-12).map((x, i, arr) => { const prev = S.contractions[S.contractions.indexOf(x) - 1]; return `<tr><td>${hhmm(x.s)}</td><td>${x.e ? mmss(x.e - x.s) : '…'}</td><td>${prev ? mmss(x.s - prev.s) : '–'}</td></tr>`; }).reverse().join('');
    return `<h1>${esc(t.ctTitle)}</h1><p class="muted small">${esc(t.ctIntro)}</p>
    <div class="card danger-card small"><b>${esc(t.ctWarn)}</b></div>
    <button class="btn ct-btn block ${running ? 'danger' : ''}" data-a="ct">${running ? esc(t.ctStop) + ' <span id="ct-live"></span>' : esc(t.ctStart)}</button>
    <div class="card"><h3>${esc(t.ctLastHour)}</h3><div class="grid2"><div class="stat"><b>${st.n}</b><span>${esc(t.ctCount)}</span></div><div class="stat"><b>${st.int ? mmss(st.int) : '–'}</b><span>${esc(t.ctAvgInt)}</span></div></div>
      <div class="stat" style="margin-top:10px"><b>${st.dur ? mmss(st.dur) : '–'}</b><span>${esc(t.ctAvgDur)}</span></div></div>
    <div class="card">${S.contractions.length ? `<table class="t"><thead><tr><th>${esc(t.ctTime)}</th><th>${esc(t.ctDur)}</th><th>${esc(t.ctInt)}</th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="muted">${esc(t.ctEmpty)}</p>`}</div>
    <div class="grid2"><button class="btn wa sm" data-a="share-ct">${I.wa}${esc(t.ctShare)}</button><button class="btn ghost sm" data-a="ct-clear">${esc(t.ctClear)}</button></div>`;
  }

  function sheetRows() {
    const t = T(), p = S.plan; const pr = o => o && (o.name || o.phone) ? [o.name, o.addr, o.phone].filter(Boolean).join(' · ') : '';
    return [
      [t.dueOn, S.dpa ? fmtD(parseD(S.dpa)) : ''], [t.pFacility, pr(p.facility)], [t.pAttendant, pr(p.attendant)],
      [t.pMyGroup, p.myGroup], [t.pDonors, p.donors.map(d => [d.name, d.group, d.phone].filter(Boolean).join(' · ')).filter(Boolean).join(' / ')],
      [t.pCompanion, pr(p.companion)], [t.pTransport1, pr(p.t1)], [t.pTransport2, pr(p.t2)], [t.pFamily, pr(p.family)],
      [t.pKids, pr(p.kids)], [t.pMoney, p.money], [t.pWishes, p.wishes], [t.pUseful, p.useful]
    ].filter(r => r[1]);
  }
  function vSheet() {
    const t = T();
    if (!S.unlocked) return `<h1>${esc(t.shTitle)}</h1>${lockBox()}`;
    return `<div class="card sheet"><h1>${esc(t.shTitle)}</h1><p><b>${esc(t.shFor)} ${esc(S.name || '…')}</b></p>
      <table>${sheetRows().map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1]).replace(/\n/g, '<br>')}</td></tr>`).join('')}</table>
      <h3 style="color:#C2262E;margin-top:14px">${esc(t.alertNow)}</h3><ul class="small">${t.signsNow.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
      <p class="small" style="color:#666">${esc(t.shGenerated)}</p></div>
    <div class="callbar noprint"><button class="btn block" data-a="print">${I.print}${esc(t.shPrint)}</button><button class="btn wa block" data-a="share-plan">${I.wa}${esc(t.pShare)}</button><button class="btn ghost block" data-go="${prevView === 'sheet' ? 'home' : prevView}">${esc(t.shBack)}</button></div>`;
  }

  function vSettings() {
    const t = T();
    return `<h1>${esc(t.setTitle)}</h1>
    <div class="card"><label class="f">${esc(t.setLang)}</label>
      <div class="seg"><button data-a="lang" data-v="fr" class="${S.lang === 'fr' ? 'on' : ''}">Français</button><button data-a="lang" data-v="en" class="${S.lang === 'en' ? 'on' : ''}">English</button></div>
      <label class="f" for="set-name">${esc(t.setName)}</label><input class="i" id="set-name" value="${esc(S.name)}" maxlength="40">
      <label class="f" for="set-dpa">${esc(t.setDpa)}</label><input class="i" type="date" id="set-dpa" value="${esc(S.dpa)}">
      <button class="btn block" style="margin-top:12px" data-a="set-save">${esc(t.setSave)}</button></div>
    ${S.unlocked ? `<div class="card"><p class="tag ok">✓ ${esc(t.lockActive)}</p><p class="small muted">${esc(S.code)}</p></div>` : lockBox()}
    <div class="card"><h3>${esc(t.setInstall)}</h3><p class="small">${esc(t.setInstallHelp)}</p></div>
    <div class="card"><h3>${esc(t.setBackup)}</h3><p class="small muted">${esc(t.setBackupHelp)}</p>
      ${S.unlocked ? `<div class="grid2"><button class="btn sm" data-a="backup">${esc(t.setBackup)}</button><label class="btn ghost sm" style="cursor:pointer">${esc(t.setRestore)}<input type="file" accept="application/json,.json" id="restore" class="hidden"></label></div>` : `<p class="small">${I.lock.replace('<svg', '<svg width="16" height="16"')} ${esc(t.lockTitle)}</p>`}</div>
    <div class="card"><h3>${esc(t.setAbout)}</h3><p class="small">${esc(t.setAboutText)}</p><p class="small muted">${esc(t.disclaimer)}</p>
      <button class="btn danger sm" data-a="erase">${esc(t.setErase)}</button></div>`;
  }

  // ---------- rendu ----------
  const VIEWS = { home: vHome, cpn: vCpn, budget: vBudget, bag: vBag, plan: vPlan, alerts: vAlerts, contractions: vContractions, sheet: vSheet, settings: vSettings };
  function render(keepScroll) {
    const root = document.getElementById('root');
    document.documentElement.lang = S ? S.lang : navLangSel;
    if (!S || !S.dpa) { root.innerHTML = `<div class="app">${onboarding()}</div>`; return; }
    const y = window.scrollY; const sel = keepScroll ? focusSel(document.activeElement) : null;
    root.innerHTML = `<div class="app">${header()}<main id="main">${VIEWS[view]()}</main></div>${tabs()}`;
    window.scrollTo(0, keepScroll ? y : 0);
    if (sel) { const el = document.querySelector(sel); if (el) { el.focus({ preventScroll: true }); try { const n = el.value.length; el.setSelectionRange(n, n); } catch (e) { } } }
    document.title = 'MamaPlan';
  }
  // garde le champ actif après un nouveau rendu (sinon le clavier se ferme en passant d'un champ à l'autre)
  function focusSel(el) {
    if (!el || !el.matches || !el.matches('input,textarea,select')) return null;
    if (el.id) return '#' + CSS.escape(el.id);
    const attrs = ['data-p', 'data-bl', 'data-bp', 'data-f', 'data-bl-t', 'data-cpn-note'].filter(a => el.hasAttribute(a));
    return attrs.length ? attrs.map(a => `[${a}="${CSS.escape(el.getAttribute(a))}"]`).join('') : null;
  }
  function go(v) { if (v !== view) { prevView = view; view = v; } render(false); }

  // ---------- partage ----------
  function shareBag() {
    const t = T(); let out = `🧳 MamaPlan · ${t.bagMissing} :\n`; let any = false;
    for (const c of ['mom', 'baby', 'papers', 'comp']) { const miss = S.bag[c].filter(i => !i.ok); if (miss.length) { any = true; out += `\n*${t.bagCats[c]}*\n` + miss.map(i => '• ' + bagLabel(c, i)).join('\n') + '\n'; } }
    share(any ? out : '🧳 MamaPlan : ' + t.bagComplete);
  }
  function shareBudget() {
    const t = T(), b = budgetStats();
    let out = `💰 MamaPlan · ${t.budgetTitle}\n${t.bTotal} : ${money(b.planned)}\n${t.bGathered} : ${money(b.gathered)}\n${t.bLeft} : ${money(b.left)}\n${t.bPerWeek} : ${money(b.perWeek)} (${b.weeks} ${t.bWeeksLeft})\n`;
    S.budget.lines.filter(l => num(l.planned)).forEach(l => { out += `• ${lineLabel(l)} : ${money(l.planned)}\n`; });
    if (S.budget.people.length) out += `\n${t.bContrib} :\n` + S.budget.people.map(p => `• ${p.name || '?'} : ${money(p.amount)} ${p.received ? '✓' : '…'}`).join('\n');
    share(out);
  }
  function sharePlan() { const t = T(); share(`⭐ ${t.shTitle} · ${S.name || ''}\n\n` + sheetRows().map(r => `*${r[0]}* : ${r[1]}`).join('\n') + `\n\n🚨 ${t.alertNow}\n` + t.signsNow.map(s => '• ' + s).join('\n') + `\n\n${t.shareIntro}`); }
  function shareCt() { const t = T(); const st = ctStats(); share(`⏱ ${t.ctTitle}\n${t.ctLastHour} : ${st.n} ${t.ctCount}, ${t.ctAvgInt} ${st.int ? mmss(st.int) : '–'}, ${t.ctAvgDur} ${st.dur ? mmss(st.dur) : '–'}\n` + S.contractions.slice(-10).map((x, i, a) => `${hhmm(x.s)} · ${x.e ? mmss(x.e - x.s) : '…'}`).join('\n')); }

  // ---------- événements ----------
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); const a = e.target.closest('[data-a]');
    if (a) { e.preventDefault(); act(a.dataset.a, a); return; }
    if (g) { e.preventDefault(); go(g.dataset.go); }
  });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.box[data-a]')) { e.preventDefault(); act(e.target.dataset.a, e.target); } });
  document.addEventListener('input', e => {
    const el = e.target; if (!S) return;
    if (el.dataset.p != null) { setPath(el.dataset.p, el.value); save(); return; }
    if (el.dataset.cpnNote != null) { const i = el.dataset.cpnNote; S.cpn[i] = Object.assign(S.cpn[i] || {}, { note: el.value }); save(); return; }
    if (el.dataset.bl != null) { S.budget.lines[el.dataset.bl][el.dataset.f] = num(el.value); save(); return; }
    if (el.dataset.blT != null) { S.budget.lines[el.dataset.blT].t = el.value; save(); return; }
    if (el.dataset.bp != null) { const p = S.budget.people[el.dataset.bp]; p[el.dataset.f] = el.dataset.f === 'amount' ? num(el.value) : el.value; save(); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && ((el.dataset.bl != null || el.dataset.bp != null) && el.dataset.f !== 'name' || el.dataset.p != null && /phone$/.test(el.dataset.p))) setTimeout(() => render(true), 0);
    if (el.id === 'restore' && el.files[0]) {
      const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (o.v !== 1 || !o.dpa) throw 0; S = Object.assign(blankState(o.lang), o); save(); toast(T().setRestored); go('home'); } catch (x) { toast(T().setBadFile); } }; r.readAsText(el.files[0]);
    }
  });

  function act(a, el) {
    const t = S ? T() : I18N[navLangSel];
    switch (a) {
      case 'ob-lang': navLangSel = el.dataset.v; render(); break;
      case 'ob-mode': { const n = document.getElementById('ob-name').value; obMode = el.dataset.v; render(); document.getElementById('ob-name').value = n; break; }
      case 'ob-start': {
        const v = document.getElementById('ob-date').value; if (!v) { document.getElementById('ob-err').textContent = t.obNeedDate; return; }
        let d = parseD(v); if (obMode === 'ddr') d = new Date(d.getTime() + 280 * DAY);
        S = blankState(navLangSel); S.name = document.getElementById('ob-name').value.trim(); S.dpa = isoD(d); save(); view = 'home'; render(); break;
      }
      case 'lang': S.lang = el.dataset.v; save(); render(true); break;
      case 'set-save': { const d = document.getElementById('set-dpa').value; S.name = document.getElementById('set-name').value.trim(); if (d) S.dpa = d; save(); toast(t.saved); render(true); break; }
      case 'cpn-done': { const i = el.dataset.i; S.cpn[i] = Object.assign(S.cpn[i] || {}, { done: !(S.cpn[i] && S.cpn[i].done) }); save(); render(true); break; }
      case 'bag-tog': { const it = S.bag[el.dataset.c][el.dataset.i]; it.ok = !it.ok; save(); render(true); break; }
      case 'bag-del': S.bag[el.dataset.c].splice(el.dataset.i, 1); save(); render(true); break;
      case 'bag-add': { const c = el.dataset.c, inp = document.getElementById('bag-new-' + c); const v = inp.value.trim(); if (v) { S.bag[c].push({ t: v, ok: false }); save(); render(true); } break; }
      case 'bl-add': S.budget.lines.push({ t: '', planned: 0, paid: 0 }); save(); render(true); break;
      case 'bl-del': S.budget.lines.splice(el.dataset.i, 1); save(); render(true); break;
      case 'bp-add': S.budget.people.push({ name: '', amount: 0, received: false }); save(); render(true); break;
      case 'bp-del': S.budget.people.splice(el.dataset.i, 1); save(); render(true); break;
      case 'bp-recv': { const p = S.budget.people[el.dataset.i]; p.received = !p.received; save(); render(true); break; }
      case 'seg': seg = el.dataset.v; render(true); break;
      case 'signs-read': S.signsRead = true; save(); render(true); break;
      case 'code': {
        const v = document.getElementById('code-in').value; const msg = document.getElementById('code-msg');
        if (validCode(v)) { const s = normCode(v); S.unlocked = true; S.code = 'MP-' + s.slice(0, 4) + '-' + s.slice(4); save(); toast(t.lockOk); render(true); }
        else { msg.textContent = t.lockBad; msg.style.color = 'var(--danger)'; }
        break;
      }
      case 'ct': { const last = S.contractions[S.contractions.length - 1]; if (last && !last.e) last.e = Date.now(); else S.contractions.push({ s: Date.now() }); if (S.contractions.length > 200) S.contractions = S.contractions.slice(-200); save(); render(true); break; }
      case 'ct-clear': if (confirm(t.ctClear + ' ?')) { S.contractions = []; save(); render(true); } break;
      case 'share-bag': shareBag(); break;
      case 'share-budget': shareBudget(); break;
      case 'share-plan': sharePlan(); break;
      case 'share-ct': shareCt(); break;
      case 'print': window.print(); break;
      case 'backup': {
        const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const u = URL.createObjectURL(blob);
        const l = document.createElement('a'); l.href = u; l.download = 'mamaplan-sauvegarde-' + isoD(new Date()) + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); break;
      }
      case 'erase': if (confirm(t.setEraseConfirm)) { try { localStorage.removeItem(KEY); } catch (x) { } S = null; view = 'home'; render(); } break;
    }
  }

  // minuterie de la contraction en cours
  setInterval(() => { const el = document.getElementById('ct-live'); if (el && S) { const l = S.contractions[S.contractions.length - 1]; if (l && !l.e) el.textContent = '· ' + mmss(Date.now() - l.s); } }, 1000);

  // test hooks (utilisés par les tests automatiques)
  window.__mp = { validCode, checkOf, readiness: () => S && readiness(), budgetStats: () => S && budgetStats(), state: () => S, go };

  render();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
</body>
</html>
